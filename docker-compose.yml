services:
  api:
    build:
      context: .
      target: api
    env_file:
      - .env
    volumes:
      - labshop_data:/data
    restart: unless-stopped
    expose:
      - "8080"

  nginx:
    build:
      context: .
      target: nginx
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      api:
        condition: service_healthy
    environment:
      - MAX_UPLOAD_MB=${MAX_UPLOAD_MB:-10}
      - ORIGIN_GZIP=${ORIGIN_GZIP:-off}
      - SSL_CERT_PATH=${SSL_CERT_PATH:-/etc/letsencrypt/live/thanhhieutiet.shop/fullchain.pem}
      - SSL_KEY_PATH=${SSL_KEY_PATH:-/etc/letsencrypt/live/thanhhieutiet.shop/privkey.pem}
    volumes:
      - ${SSL_CERTS_DIR:-./ssl}:/etc/letsencrypt:ro
      - ./logs/nginx:/var/log/nginx
    restart: unless-stopped

volumes:
  labshop_data:
