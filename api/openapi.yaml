openapi: 3.0.3
info:
  title: LabShop Origin & Security Lab API
  version: 1.0.0
  description: LabShop Origin API for CMC WAAP and Multi-CDN lab practice.
servers:
  - url: /
    description: Current host origin server
paths:
  /api/health:
    get:
      summary: Health check
      description: Returns service health status
      tags:
        - System
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /api/time:
    get:
      summary: Current time
      description: Returns current timestamp without cache headers to observe CDN default cache behavior
      tags:
        - Lab
      responses:
        '200':
          description: Current origin time
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimeResponse'

  /api/cache/{mode}:
    get:
      summary: Cache behavior test
      description: Tests various origin cache headers (public, no-store, etag, vary, set-cookie)
      tags:
        - Lab
      parameters:
        - name: mode
          in: path
          required: true
          description: Cache mode to simulate
          schema:
            type: string
            enum:
              - public
              - no-store
              - etag
              - vary
              - set-cookie
        - name: v
          in: query
          required: false
          description: Optional version parameter for cache key testing
          schema:
            type: string
      responses:
        '200':
          description: Cache response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CacheResponse'
        '304':
          description: Not Modified when If-None-Match matches ETag
        '400':
          description: Invalid mode requested
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/headers:
    get:
      summary: Echo received headers
      description: Returns all received request headers (masking Authorization and Cookie) and client IP information
      tags:
        - Lab
      responses:
        '200':
          description: Echoed headers
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HeadersResponse'

  /api/echo:
    get:
      summary: Echo request details (GET)
      description: Returns parsed query, headers, cookies, form data, and body
      tags:
        - Lab
      responses:
        '200':
          description: Request details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EchoResponse'
    post:
      summary: Echo request details (POST)
      description: Returns parsed query, headers, cookies, form data, and body
      tags:
        - Lab
      responses:
        '200':
          description: Request details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EchoResponse'

  /api/echo/{path}:
    get:
      summary: Echo request with wildcard subpath (GET)
      description: Echoes request with custom path parameter
      tags:
        - Lab
      parameters:
        - name: path
          in: path
          required: true
          description: Subpath to echo
          schema:
            type: string
      responses:
        '200':
          description: Request details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EchoResponse'
    post:
      summary: Echo request with wildcard subpath (POST)
      description: Echoes request with custom path parameter
      tags:
        - Lab
      parameters:
        - name: path
          in: path
          required: true
          description: Subpath to echo
          schema:
            type: string
      responses:
        '200':
          description: Request details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EchoResponse'

  /api/status/{code}:
    get:
      summary: Simulate HTTP status code
      description: Returns specified HTTP status code for testing error handling and CDN error page rules
      tags:
        - Lab
      parameters:
        - name: code
          in: path
          required: true
          description: Status code to return
          schema:
            type: integer
            enum: [200, 204, 301, 302, 304, 400, 401, 403, 404, 429, 500, 502, 503, 504]
      responses:
        default:
          description: Status code simulation response

  /api/slow:
    get:
      summary: Slow response test
      description: Simulates slow response with artificial delay for timeout and failover testing
      tags:
        - Lab
      parameters:
        - name: ms
          in: query
          required: false
          description: Delay in milliseconds (capped by server configuration)
          schema:
            type: integer
            default: 1000
      responses:
        '200':
          description: Delayed response completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SlowResponse'

  /api/payload:
    get:
      summary: Large payload generator
      description: Generates synthetic response payload of specified size for compression and throughput testing
      tags:
        - Lab
      parameters:
        - name: kb
          in: query
          required: false
          description: Size in kilobytes
          schema:
            type: integer
            default: 100
      responses:
        '200':
          description: Generated payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayloadResponse'

  /api/stats:
    get:
      summary: Origin hit statistics
      description: Returns cumulative hit counts, status code distribution, and top endpoint statistics
      tags:
        - Lab
      responses:
        '200':
          description: Cumulative statistics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatsResponse'

  /api/stats/reset:
    post:
      summary: Reset statistics
      description: Resets in-memory origin hit counter. Requires X-Admin-Token header.
      tags:
        - Lab
      security:
        - AdminSecret: []
      responses:
        '200':
          description: Statistics successfully reset
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/upload:
    post:
      summary: File upload test
      description: Accepts multipart/form-data file upload to test request body inspection and limits
      tags:
        - Lab
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Upload processed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadResponse'
        '400':
          description: Missing or invalid file
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: Payload too large
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/tutorial/scenarios:
    get:
      summary: List tutorial scenarios
      description: Returns list of multi-CDN and WAAP lab tutorial scenarios
      tags:
        - Tutorial
      parameters:
        - name: group
          in: query
          required: false
          description: Filter by scenario group (cdn, waap, shop)
          schema:
            type: string
        - name: priority
          in: query
          required: false
          description: Filter by priority (P0, P1)
          schema:
            type: string
      responses:
        '200':
          description: List of scenarios
          headers:
            ETag:
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Scenario'
        '304':
          description: Not modified

  /api/tutorial/scenarios/{id}:
    get:
      summary: Get scenario detail
      description: Returns single scenario by ID
      tags:
        - Tutorial
      parameters:
        - name: id
          in: path
          required: true
          description: Scenario identifier
          schema:
            type: string
      responses:
        '200':
          description: Scenario details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Scenario'
        '404':
          description: Scenario not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /tutorial/scenarios:
    get:
      summary: List tutorial scenarios (alias)
      description: Alias path for listing tutorial scenarios
      tags:
        - Tutorial
      responses:
        '200':
          description: List of scenarios
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Scenario'

  /tutorial/scenarios/{id}:
    get:
      summary: Get scenario detail (alias)
      description: Alias path for getting a single scenario
      tags:
        - Tutorial
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Scenario details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Scenario'

  /api/auth/register:
    post:
      summary: Customer registration
      description: Register a new customer account
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Account created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Invalid input or validation failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Email already registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/auth/login:
    post:
      summary: User login
      description: Authenticate with email and password to receive JWT token
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Invalid email or password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/auth/me:
    get:
      summary: Current user profile
      description: Returns profile of currently authenticated user
      tags:
        - Auth
      security:
        - BearerAuth: []
      responses:
        '200':
          description: User profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDTO'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      summary: Update profile
      description: Update current user profile details
      tags:
        - Auth
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMeRequest'
      responses:
        '200':
          description: Profile updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDTO'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/auth/change-password:
    post:
      summary: Change password
      description: Change current user password
      tags:
        - Auth
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          description: Password updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: Invalid request or weak password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized or invalid old password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/categories:
    get:
      summary: List categories
      description: Returns all product categories
      tags:
        - Catalog
      responses:
        '200':
          description: List of categories
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListCategoriesResponse'

  /api/products:
    get:
      summary: List products
      description: Search, filter, and paginate product catalog
      tags:
        - Catalog
      parameters:
        - name: q
          in: query
          required: false
          description: Search term
          schema:
            type: string
        - name: category
          in: query
          required: false
          description: Filter by category ID
          schema:
            type: string
        - name: sort
          in: query
          required: false
          description: Sort ordering (price_asc, price_desc, rating, newest)
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: page_size
          in: query
          required: false
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Paginated product list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListProductsResponse'

  /api/products/{slug}:
    get:
      summary: Get product by slug
      description: Returns product details for given slug
      tags:
        - Catalog
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Product details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductDTO'
        '404':
          description: Product not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/cart:
    get:
      summary: Get cart
      description: Returns current user shopping cart
      tags:
        - Cart
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Cart details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartDTO'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      summary: Clear cart
      description: Removes all items from cart
      tags:
        - Cart
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Cart cleared
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartDTO'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/cart/items/{product_id}:
    put:
      summary: Update item quantity
      description: Sets quantity for a product in cart (quantity=0 removes item)
      tags:
        - Cart
      security:
        - BearerAuth: []
      parameters:
        - name: product_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCartItemRequest'
      responses:
        '200':
          description: Cart updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartDTO'
        '400':
          description: Invalid quantity or insufficient stock
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      summary: Remove item from cart
      description: Removes product entirely from cart
      tags:
        - Cart
      security:
        - BearerAuth: []
      parameters:
        - name: product_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Cart updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartDTO'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/cart/coupon:
    post:
      summary: Apply coupon
      description: Applies a discount coupon to the cart
      tags:
        - Cart
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplyCouponRequest'
      responses:
        '200':
          description: Coupon applied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartDTO'
        '400':
          description: Invalid coupon
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      summary: Remove coupon
      description: Removes coupon from the cart
      tags:
        - Cart
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Coupon removed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartDTO'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/orders:
    post:
      summary: Create order (Checkout)
      description: Converts items in cart to an order. Supports Idempotency-Key header.
      tags:
        - Order
      security:
        - BearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: Optional idempotency key for safe retries
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '201':
          description: Order created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDTO'
        '400':
          description: Cart is empty or invalid details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      summary: List user orders
      description: Returns paginated orders for authenticated user
      tags:
        - Order
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: page_size
          in: query
          required: false
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Orders list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListOrdersResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/orders/{id}:
    get:
      summary: Get order details
      description: Returns order by ID
      tags:
        - Order
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Order details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDTO'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Order not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/orders/{id}/pay:
    post:
      summary: Pay order
      description: Processes payment for pending order through payment gateway
      tags:
        - Order
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Payment successful and order marked paid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDTO'
        '400':
          description: Order cannot be paid or payment failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/orders/{id}/cancel:
    post:
      summary: Cancel order
      description: Cancels pending order
      tags:
        - Order
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Order cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDTO'
        '400':
          description: Order cannot be cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/products/{slug}/reviews:
    get:
      summary: List product reviews
      description: Returns reviews for product slug
      tags:
        - Review
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: page_size
          in: query
          required: false
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Reviews list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListReviewsResponse'
    post:
      summary: Create product review
      description: Adds a review and rating for purchased product
      tags:
        - Review
      security:
        - BearerAuth: []
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReviewRequest'
      responses:
        '201':
          description: Review created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewDTO'
        '400':
          description: Validation error or product not purchased
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/reviews/{id}:
    delete:
      summary: Delete review
      description: Deletes user's own review or any review if admin
      tags:
        - Review
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Review deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Review not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/support/tickets:
    post:
      summary: Create support ticket
      description: Opens a new support ticket
      tags:
        - Support
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTicketRequest'
      responses:
        '201':
          description: Ticket opened
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketDTO'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      summary: List user support tickets
      description: Returns tickets created by authenticated user
      tags:
        - Support
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: page_size
          in: query
          required: false
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Tickets list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListTicketsResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/support/tickets/{id}:
    get:
      summary: Get ticket detail
      description: Returns ticket details including thread messages and attachments
      tags:
        - Support
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
