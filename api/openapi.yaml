components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Bearer JWT token issued by /api/auth/login or /api/auth/register
    AdminSecret:
      type: apiKey
      in: header
      name: X-Admin-Token
      description: Static origin administrative token

  schemas:
    HealthResponse:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          example: ok

    TimeResponse:
      type: object
      required:
        - generated_at
        - request_id
      properties:
        generated_at:
          type: string
          format: date-time
        request_id:
          type: string

    CacheResponse:
      type: object
      required:
        - mode
        - generated_at
        - request_id
        - v
      properties:
        mode:
          type: string
        generated_at:
          type: string
          format: date-time
        request_id:
          type: string
        v:
          type: string

    HeadersResponse:
      type: object
      required:
        - headers
        - remote_addr
        - x_forwarded_for
      properties:
        headers:
          type: object
          additionalProperties:
            type: string
        remote_addr:
          type: string
        x_forwarded_for:
          type: array
          items:
            type: string

    EchoResponse:
      type: object
      required:
        - path
        - subpath
        - method
        - query
        - headers
        - cookies
        - form
        - raw_body
      properties:
        path:
          type: string
        subpath:
          type: string
        method:
          type: string
        query:
          type: object
          additionalProperties:
            type: string
        headers:
          type: object
          additionalProperties:
            type: string
        cookies:
          type: object
          additionalProperties:
            type: string
        form:
          type: object
          additionalProperties:
            type: string
        body:
          description: Parsed JSON body if applicable
        raw_body:
          type: string

    SlowResponse:
      type: object
      required:
        - duration_ms
        - server_time
        - message
      properties:
        duration_ms:
          type: integer
        server_time:
          type: string
          format: date-time
        message:
          type: string

    PayloadResponse:
      type: object
      required:
        - size_kb
        - data
      properties:
        size_kb:
          type: integer
        data:
          type: string

    StatsResponse:
      type: object
      required:
        - total_hits
        - status_counts
        - endpoints
      properties:
        total_hits:
          type: integer
        status_counts:
          type: object
          additionalProperties:
            type: integer
        endpoints:
          type: object
          additionalProperties:
            type: integer

    UploadResponse:
      type: object
      required:
        - filename
        - size
        - content_type
        - sha256
        - stored
      properties:
        filename:
          type: string
        size:
          type: integer
        content_type:
          type: string
        sha256:
          type: string
        stored:
          type: boolean

    Scenario:
      type: object
      required:
        - id
        - name
        - group
        - priority
        - description
        - docs_reference
        - setup
        - steps
        - cleanup
      properties:
        id:
          type: string
        name:
          type: string
        group:
          type: string
        priority:
          type: string
        description:
          type: string
        docs_reference:
          type: string
        setup:
