services:
  locust:
    image: locustio/locust:2.31.8
    container_name: labshop-locust
    ports:
      - "8089:8089"
    volumes:
      - ./locustfile.py:/mnt/locust/locustfile.py:ro
    command: -f /mnt/locust/locustfile.py
    networks:
      - loadtest-net
    restart: unless-stopped

  locust-exporter:
    image: vokash3/locust_exporter:latest
    container_name: labshop-locust-exporter
    ports:
      - "9191:9191"
    environment:
      - LOCUST_HOST=http://locust:8089
      - EXPORTER_PORT=9191
    depends_on:
      - locust
    networks:
      - loadtest-net
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: labshop-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - locust-exporter
    networks:
      - loadtest-net
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.2.0
    container_name: labshop-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - loadtest-net
    restart: unless-stopped

networks:
  loadtest-net:
    driver: bridge
