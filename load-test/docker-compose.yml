services:
  locust-master:
    image: locustio/locust:2.31.8
    container_name: labshop-locust-master
    ports:
      - "8089:8089"
    volumes:
      - ./locustfile.py:/mnt/locust/locustfile.py:ro
    command: -f /mnt/locust/locustfile.py --master -H ${LOCUST_HOST:-https://app.thanhhieutiet.shop}
    environment:
      - TEST_MODE=${TEST_MODE:-performance}
      - USE_RANGE_HEADER=${USE_RANGE_HEADER:-true}
      - LOCUST_HOST=${LOCUST_HOST:-https://app.thanhhieutiet.shop}
    networks:
      - loadtest-net
    restart: unless-stopped

  locust-worker:
    image: locustio/locust:2.31.8
    volumes:
      - ./locustfile.py:/mnt/locust/locustfile.py:ro
    command: -f /mnt/locust/locustfile.py --worker --master-host=locust-master
    environment:
      - TEST_MODE=${TEST_MODE:-performance}
      - USE_RANGE_HEADER=${USE_RANGE_HEADER:-true}
      - LOCUST_HOST=${LOCUST_HOST:-https://app.thanhhieutiet.shop}
    deploy:
      replicas: 4
    depends_on:
      - locust-master
    networks:
      - loadtest-net
    restart: unless-stopped

  locust-exporter:
    image: containersol/locust_exporter:latest
    container_name: labshop-locust-exporter
    ports:
      - "9646:9646"
    environment:
      - LOCUST_EXPORTER_URI=http://locust-master:8089
    depends_on:
      - locust-master
    networks:
      - loadtest-net
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: labshop-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - locust-exporter
    networks:
      - loadtest-net
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.2.0
    container_name: labshop-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - loadtest-net
    restart: unless-stopped

  # ============================================================================
  # OPTIONAL / LOGGING SERVICES
  # Assigned to profile "logging" so they are not started by default during load test.
  # To enable: docker compose --profile logging up -d
  # ============================================================================
  loki:
    image: grafana/loki:3.1.0
    container_name: labshop-loki
    profiles:
      - logging
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./loki/loki-config.yaml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    networks:
      - loadtest-net
    restart: unless-stopped

  promtail:
    image: grafana/promtail:3.1.0
    container_name: labshop-promtail
    profiles:
      - logging
    command: -config.file=/etc/promtail/promtail-config.yaml
    volumes:
      - ./promtail/promtail-config.yaml:/etc/promtail/promtail-config.yaml:ro
      - ../logs/nginx:/var/log/nginx:ro
      - promtail_data:/data
    depends_on:
      - loki
    networks:
      - loadtest-net
    restart: unless-stopped

volumes:
  loki_data:
  promtail_data:

networks:
  loadtest-net:
    driver: bridge
