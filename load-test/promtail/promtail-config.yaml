server:
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: info

positions:
  filename: /data/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push
    batchwait: 1s
    batchsize: 1048576

scrape_configs:
  # ==============================================================================
  # Nginx Access Logs (Structured JSON)
  # ==============================================================================
  - job_name: nginx-access
    static_configs:
      - targets:
          - localhost
        labels:
          job: nginx
          service: labshop-origin
          __path__: /var/log/nginx/access.log

    pipeline_stages:
      # Parse the structured JSON output from Nginx
      - json:
          expressions:
            time_local: time_local
            status: status
            method: method
            host: host
            uri: uri
            remote_addr: remote_addr
            realip_remote_addr: realip_remote_addr
            xff: xff
            cf_ip: cf_ip
            true_client_ip: true_client_ip
            request_time: request_time
            upstream_response_time: upstream_response_time
            upstream_status: upstream_status
            body_bytes_sent: body_bytes_sent
            ua: ua
            referer: referer
            cdn_cache: cdn_cache
            ssl_protocol: ssl_protocol

      # Promote high-cardinality-safe attributes to queryable labels
      - labels:
          status:
          method:
          host:
          cdn_cache:

      # Sync log timestamp with Nginx $time_iso8601
      - timestamp:
          source: time_local
          format: RFC3339

  # ==============================================================================
  # Nginx Error Logs (Standard Text)
  # ==============================================================================
  - job_name: nginx-error
    static_configs:
      - targets:
          - localhost
        labels:
          job: nginx-error
          service: labshop-origin
          __path__: /var/log/nginx/error.log
