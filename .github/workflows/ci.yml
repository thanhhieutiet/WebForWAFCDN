name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  backend:
    name: Backend Tests & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true

      - name: Verify Go dependencies
        run: go mod verify

      - name: Run Go vet
        run: go vet ./...

      - name: Run Architecture tests
        run: go test -v ./internal/archtest/...

      - name: Run Unit & Integration tests with race detector
        run: go test -v -race ./...

      - name: Build CLI tools and server binary
        run: |
          go build -v -o /dev/null ./cmd/server
          go build -v -o /dev/null ./cmd/genassets
          go build -v -o /dev/null ./cmd/smoke

  frontend:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Frontend Tests
        working-directory: frontend
        run: npm test

      - name: Build Frontend SPA
        working-directory: frontend
        run: npm run build

  docker:
    name: Docker Build & Compose Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate docker compose configuration
        run: docker compose config

      - name: Build Docker images
        run: docker compose build
